        </table>
      </div>
      <button onclick="toggleRuleModal(false)" class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-white text-xs font-medium">關閉</button>

  </div>

  <script>

    const firebaseConfig = {

      databaseURL: "https://game-theory-9aaae-default-rtdb.firebaseio.com",

    };

    let db;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
    } catch (e) {
      console.error("Firebase Init Error:", e);
      document.getElementById("app").innerHTML = `<div class="p-6 text-center text-rose-400 text-sm">Firebase 初始化異常: ${e.message}</div>`;
    }

    const PAYOFF = {
      "A-A": { score1: 3, score2: 3, label1: "+3", label2: "+3", tag: "雙方合作" },
      "A-B": { score1: -2, score2: 5, label1: "-2", label2: "+5", tag: "背叛獲利" },
      "B-A": { score1: 5, score2: -2, label1: "+5", label2: "-2", tag: "背叛獲利" },
      "B-B": { score1: 1, score2: 1, label1: "+1", label2: "+1", tag: "相互對立" }
    };

    // 全域狀態
    let state = {
      role: null, // 'host' | 'player'
      roomId: "",
      playerName: localStorage.getItem("gt_pname_v3") || "",
      playerId: localStorage.getItem("gt_pid_v3") || ("p_" + Math.random().toString(36).substring(2, 9)),
      roomData: null
    };
    localStorage.setItem("gt_pid_v3", state.playerId);

    // 檢查網址是否有自帶 room
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("room")) {
      state.roomId = urlParams.get("room").toUpperCase().trim();
    }

    function toggleRuleModal(show) {
      const modal = document.getElementById("rule-modal");
      if (show) {
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      } else {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      }
    }

    // 監聽 Firebase 資料
    let activeListenerRef = null;
    function subscribeToRoom(code) {
      if (activeListenerRef) activeListenerRef.off();
      activeListenerRef = db.ref("rooms/" + code);
      activeListenerRef.on("value", (snapshot) => {
        const val = snapshot.val();
        if (!val) {
          if (state.role === "player") {
            alert("房間已解散或不存在！");
            exitRoom();
          }
          return;
        }
        state.roomData = val;
        render();
      }, (err) => {
        console.error("Database error:", err);
      });
    }

    // 退出
    function exitRoom() {
      if (activeListenerRef) activeListenerRef.off();
      state.role = null;
      state.roomData = null;
      const url = new URL(window.location.href);
      url.search = "";
      window.history.replaceState({}, "", url.toString());
      render();
    }
