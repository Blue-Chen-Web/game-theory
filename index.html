<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCdy8u9yX2Ep09MGBR6UB9pTV21Qu4g_BM",
      authDomain: "game-theory-9aaae.firebaseapp.com",
      databaseURL: "https://game-theory-9aaae-default-rtdb.firebaseio.com",
      projectId: "game-theory-9aaae",
      storageBucket: "game-theory-9aaae.firebasestorage.app",
      messagingSenderId: "901157590930",
      appId: "1:901157590930:web:b7c8e40fb4ee255dca934b",
      measurementId: "G-PF713E3SNT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.__fb = { db, ref, set, get, update, onValue, remove };

  <!-- React 應用邏輯 -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PAYOFF = {
      "A-A": { score1: 3, score2: 3, label1: "+3", label2: "+3", tag: "雙方合作", type: "coop" },
      "A-B": { score1: -2, score2: 5, label1: "-2", label2: "+5", tag: "背叛獲利", type: "defect" },
      "B-A": { score1: 5, score2: -2, label1: "+5", label2: "-2", tag: "背叛獲利", type: "defect" },
      "B-B": { score1: 1, score2: 1, label1: "+1", label2: "+1", tag: "相互對立", type: "conflict" }
    };

    function App() {
      const [role, setRole] = useState(null); // 'host' | 'player'
      const [roomId, setRoomId] = useState("");
      const [playerName, setPlayerName] = useState("");
      const [playerId, setPlayerId] = useState("");
      const [roomData, setRoomData] = useState(null);
      const [connected, setConnected] = useState(false);
      const [showRuleModal, setShowRuleModal] = useState(false);
      const qrCanvasRef = useRef(null);

      // 自動讀取 URL 參數 (?room=123456)
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const r = params.get("room");
        if (r) setRoomId(r.toUpperCase());
        
        let storedId = localStorage.getItem("gt_pid");
        if (!storedId) {
          storedId = "p_" + Math.random().toString(36).substring(2, 9);
          localStorage.setItem("gt_pid", storedId);
        }
        setPlayerId(storedId);
      }, []);

      // 監聽 Firebase 房間資料
      useEffect(() => {
        if (!roomId || !window.__fb) return;
        const { db, ref, onValue } = window.__fb;
        const roomRef = ref(db, `rooms/${roomId}`);

        const unsubscribe = onValue(roomRef, (snapshot) => {
          const val = snapshot.val();
          setRoomData(val);
          setConnected(true);
        }, (err) => {
          console.error("Firebase 連線錯誤:", err);
        });

        return () => unsubscribe();
      }, [roomId]);

      // QR Code 繪製
      useEffect(() => {
        if (role === "host" && roomId && qrCanvasRef.current && window.QRCode) {
          const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
          window.QRCode.toCanvas(qrCanvasRef.current, joinUrl, {
            width: 160,
            margin: 1,
            color: { dark: "#0f172a", light: "#f8fafc" }
          });
        }
      }, [role, roomId, roomData?.status]);

      // --- 主持人功能 ---
      const createRoomAsHost = async () => {
        const code = Math.random().toString(36).substring(2, 8).toUpperCase();
        const { db, ref, set } = window.__fb;
        const initialRoom = {
          id: code,
          createdAt: Date.now(),
          status: "LOBBY", // LOBBY, PLAYING, REVEALED
          round: 1,
          players: {},
          pairs: [],
          byePlayerId: null,
          history: [] // 儲存多回合演化數據
        };
        await set(ref(db, `rooms/${code}`), initialRoom);
        setRoomId(code);
        setRole("host");
      };

      // 啟動下一輪：shuffle 為 false 表示「維持原配對 (不洗牌)」
      const startNextRound = async (shuffle = true) => {
        if (!roomData || !window.__fb) return;
        const { db, ref, update } = window.__fb;
        const players = roomData.players || {};
        const pKeys = Object.keys(players);

        if (pKeys.length < 2) {
          alert("至少需要 2 位玩家加入才能開始遊戲！");
          return;
        }

        let newPairs = [];
        let byeId = null;

        if (!shuffle && (roomData.pairs || []).length > 0) {
          // 不洗牌：維持上一輪的雙人配對
          newPairs = (roomData.pairs || []).map(p => ({
            p1: p.p1,
            p2: p.p2,
            c1: null,
            c2: null
          }));
          byeId = roomData.byePlayerId || null;
        } else {
          // 隨機洗牌配對
          let playerPool = [...pKeys];
          playerPool.sort(() => Math.random() - 0.5);

          if (playerPool.length % 2 !== 0) {
            byeId = playerPool.pop();
          }

          for (let i = 0; i < playerPool.length; i += 2) {
            newPairs.push({
              p1: playerPool[i],
              p2: playerPool[i + 1],
              c1: null,
              c2: null
            });
          }
        }

        // 重置所有玩家本輪選擇
        const updatedPlayers = { ...players };
        Object.keys(updatedPlayers).forEach(k => {
          updatedPlayers[k].currentChoice = null;
        });

        await update(ref(db, `rooms/${roomId}`), {
          status: "PLAYING",
          round: (roomData.round || 1) + (roomData.status === "REVEALED" ? 1 : 0),
          pairs: newPairs,
          byePlayerId: byeId,
          players: updatedPlayers
        });
      };

      // 揭曉並結算此回合，同時記錄演化數據
      const revealResults = async () => {
        if (!roomData || !window.__fb) return;
        const { db, ref, update } = window.__fb;
        const pairs = roomData.pairs || [];
        const players = { ...(roomData.players || {}) };

        let totalCoopA = 0; // 選甲人數
        let totalDefectB = 0; // 選乙人數
        let outcomesCount = { "A-A": 0, "A-B": 0, "B-A": 0, "B-B": 0 };
        let roundScoreSum = 0;

        pairs.forEach(pair => {
          const c1 = players[pair.p1]?.currentChoice || "B";
          const c2 = players[pair.p2]?.currentChoice || "B";
          pair.c1 = c1;
          pair.c2 = c2;

          if (c1 === "A") totalCoopA++; else totalDefectB++;
          if (c2 === "A") totalCoopA++; else totalDefectB++;

          const key = `${c1}-${c2}`;
          if (outcomesCount[key] !== undefined) outcomesCount[key]++;

          const outcome = PAYOFF[key] || { score1: 0, score2: 0 };
          roundScoreSum += (outcome.score1 + outcome.score2);

          if (players[pair.p1]) {
            players[pair.p1].score = (players[pair.p1].score || 0) + outcome.score1;
            players[pair.p1].lastChange = outcome.score1;
          }
          if (players[pair.p2]) {
            players[pair.p2].score = (players[pair.p2].score || 0) + outcome.score2;
            players[pair.p2].lastChange = outcome.score2;
          }
        });

        const activePlayerCount = pairs.length * 2;
        const coopRate = activePlayerCount > 0 ? Math.round((totalCoopA / activePlayerCount) * 100) : 0;
        const avgScore = activePlayerCount > 0 ? Number((roundScoreSum / activePlayerCount).toFixed(1)) : 0;

        // 回合演化紀錄節點
        const roundSummary = {
          round: roomData.round || 1,
          coopRate, // 甲(合作)百分比
          defectRate: 100 - coopRate, // 乙(自保)百分比
          coopA: totalCoopA,
          defectB: totalDefectB,
          outcomes: outcomesCount,
          avgScore,
          timestamp: Date.now()
        };

        const existingHistory = roomData.history || [];
        const updatedHistory = [...existingHistory, roundSummary];

        await update(ref(db, `rooms/${roomId}`), {
          status: "REVEALED",
          pairs: pairs,
          players: players,
          history: updatedHistory
        });
      };

      const addTestBots = async (count = 4) => {
        if (!roomData || !window.__fb) return;
        const { db, ref, update } = window.__fb;
        const currentCount = Object.keys(roomData.players || {}).length;
        const updates = {};
        for (let i = 1; i <= count; i++) {
          const botId = `bot_${Date.now()}_${i}`;
          updates[`rooms/${roomId}/players/${botId}`] = {
            id: botId,
            name: `測試學員${currentCount + i}號`,
            score: 0,
            isBot: true,
            currentChoice: null
          };
        }
        await update(ref(db), updates);
      };

      const autoBotsChoose = async () => {
        if (!roomData || !window.__fb) return;
        const { db, ref, update } = window.__fb;
        const players = roomData.players || {};
        const updates = {};
        Object.values(players).forEach(p => {
          if (p.isBot && !p.currentChoice) {
            updates[`rooms/${roomId}/players/${p.id}/currentChoice`] = Math.random() > 0.45 ? "A" : "B";
          }
        });
        await update(ref(db), updates);
      };

      // --- 學員功能 ---
      const joinRoomAsPlayer = async () => {
        if (!roomId.trim() || !playerName.trim()) {
          alert("請輸入房號與您的姓名/代號！");
          return;
        }
        const { db, ref, get, update } = window.__fb;
        const cleanRoom = roomId.trim().toUpperCase();
        const snap = await get(ref(db, `rooms/${cleanRoom}`));
        if (!snap.exists()) {
          alert("找不到此房間，請確認房號是否正確！");
          return;
        }

        await update(ref(db, `rooms/${cleanRoom}/players/${playerId}`), {
          id: playerId,
          name: playerName.trim(),
          score: 0,
          currentChoice: null
        });

        setRoomId(cleanRoom);
        setRole("player");
      };

      const submitChoice = async (choice) => {
        if (!roomData || !window.__fb) return;
        const { db, ref, update } = window.__fb;
        await update(ref(db, `rooms/${roomId}/players/${playerId}`), {
          currentChoice: choice
        });
      };

      const myPair = (roomData?.pairs || []).find(p => p.p1 === playerId || p.p2 === playerId);
      const isBye = roomData?.byePlayerId === playerId;
      const opponentId = myPair ? (myPair.p1 === playerId ? myPair.p2 : myPair.p1) : null;
      const opponent = opponentId ? roomData?.players?.[opponentId] : null;
      const myCurrentChoice = roomData?.players?.[playerId]?.currentChoice;

      // ----------------------------------------------------
      // 畫面渲染：首頁入口
      // ----------------------------------------------------
      if (!role) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
            <div className="w-full max-w
